openapi: 3.0.3
info:
  title: API Sistem Informasi Akademik (MVC)
  description: Dokumentasi OpenAPI untuk API Acara 21.
  version: 1.0.0
servers:
  - url: http://localhost/minngu1/acara21/public
    description: Server Laragon lokal; URL resource diteruskan ke Router oleh .htaccess
tags:
  - name: Authentication
    description: Registrasi dan login pengguna
  - name: Mahasiswa
    description: Pengelolaan data mahasiswa

paths:
  /register:
    post:
      tags:
        - Authentication
      summary: Mendaftarkan pengguna baru (AuthController::register)
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: mahasiswa_uji
              email: mahasiswa_uji@example.com
              password: contoh-password
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Registrasi berhasil
                data:
                  id: '1'
                errors: []
                timestamp: '2026-11-18T20:00:00+07:00'
        '400':
          description: Field wajib kosong atau username/email sudah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: Username, email, dan password wajib diisi
                data: null
                errors: []
                timestamp: '2026-11-18T20:00:00+07:00'
        '422':
          description: Format email tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: Format email tidak valid
                data: null
                errors: []
                timestamp: '2026-11-18T20:00:00+07:00'

  /login:
    post:
      tags:
        - Authentication
      summary: Autentikasi pengguna (AuthController::login)
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: mahasiswa_uji
              password: contoh-password
      responses:
        '200':
          description: Login berhasil; token JWT berlaku selama lima menit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Login berhasil
                data:
                  token: <jwt-token>
                  role: user
                errors: []
                timestamp: '2026-11-18T20:05:00+07:00'
        '400':
          description: Username atau password wajib diisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: Username dan password wajib diisi
                data: null
                errors: []
                timestamp: '2026-11-18T20:05:00+07:00'
        '401':
          description: Username atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: Username atau password salah
                data: null
                errors: []
                timestamp: '2026-11-18T20:05:00+07:00'

  /mahasiswa:
    get:
      tags:
        - Mahasiswa
      summary: Mengambil data mahasiswa (MahasiswaController::index)
      operationId: getMahasiswa
      parameters:
        - name: nim
          in: query
          required: false
          description: Isi untuk mengambil satu mahasiswa; tanpa NIM, API mengembalikan seluruh data.
          schema:
            type: string
            minLength: 9
            maxLength: 9
          example: E41230002
      responses:
        '200':
          description: Data mahasiswa berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                list:
                  summary: Daftar mahasiswa
                  value:
                    success: true
                    message: Data berhasil diambil
                    data:
                      - nim: E41230002
                        nama: Siti Aminah
                        jenis_kelamin: P
                        alamat: Jl. Contoh
                        email: siti@example.com
                        id_prodi: '1'
                        angkatan: '2024'
                        status: aktif
                        foto: null
                    errors: []
                    timestamp: '2026-11-18T20:10:00+07:00'
                single:
                  summary: Satu mahasiswa ditemukan
                  value:
                    success: true
                    message: Data berhasil diambil
                    data:
                      nim: E41230002
                      nama: Siti Aminah
                      jenis_kelamin: P
                      alamat: Jl. Contoh
                      email: siti@example.com
                      id_prodi: '1'
                      angkatan: '2024'
                      status: aktif
                      foto: null
                    errors: []
                    timestamp: '2026-11-18T20:10:00+07:00'
        '404':
          $ref: '#/components/responses/StudentNotFound'

    post:
      tags:
        - Mahasiswa
      summary: Menambahkan data mahasiswa (MahasiswaController::store)
      operationId: createMahasiswa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaCreateRequest'
            example:
              nim: E41230002
              nama: Siti Aminah
              jenis_kelamin: P
              alamat: Jl. Contoh
              email: siti@example.com
              id_prodi: 1
              angkatan: '2024'
              status: aktif
              foto: null
      responses:
        '201':
          description: Data mahasiswa berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Data berhasil ditambahkan
                data:
                  nim: E41230002
                  nama: Siti Aminah
                  jenis_kelamin: P
                  alamat: Jl. Contoh
                  email: siti@example.com
                  id_prodi: 1
                  angkatan: 2024
                  status: aktif
                  foto: null
                errors: []
                timestamp: '2026-11-18T20:12:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidMahasiswa'

  /mahasiswa/{nim}:
    parameters:
      - name: nim
        in: path
        required: true
        description: NIM mahasiswa dengan panjang 9 karakter.
        schema:
          type: string
          minLength: 9
          maxLength: 9
        example: E41230002

    get:
      tags:
        - Mahasiswa
      summary: Mengambil satu mahasiswa berdasarkan NIM (MahasiswaController::index)
      operationId: getMahasiswaByNim
      responses:
        '200':
          description: Data mahasiswa ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Data berhasil diambil
                data:
                  nim: E41230002
                  nama: Siti Aminah
                  jenis_kelamin: P
                  alamat: Jl. Contoh
                  email: siti@example.com
                  id_prodi: '1'
                  angkatan: '2024'
                  status: aktif
                  foto: null
                errors: []
                timestamp: '2026-11-18T20:10:00+07:00'
        '404':
          $ref: '#/components/responses/StudentNotFound'

    put:
      tags:
        - Mahasiswa
      summary: Memperbarui data mahasiswa (MahasiswaController::update)
      operationId: updateMahasiswa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Kirim field yang akan diubah; semua field boleh dikirim sekaligus.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaUpdateRequest'
            example:
              nim: E41230002
              nama: Siti Aminah Updated
              jenis_kelamin: P
              alamat: Jl. Contoh Baru
              email: siti.updated@example.com
              id_prodi: 1
              angkatan: '2024'
              status: aktif
              foto: null
      responses:
        '200':
          description: Data mahasiswa berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Data berhasil diperbarui
                data:
                  nim: E41230002
                  nama: Siti Aminah Updated
                  jenis_kelamin: P
                  alamat: Jl. Contoh Baru
                  email: siti.updated@example.com
                  id_prodi: 1
                  angkatan: 2024
                  status: aktif
                  foto: null
                errors: []
                timestamp: '2026-11-18T20:15:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidMahasiswa'

    delete:
      tags:
        - Mahasiswa
      summary: Menghapus data mahasiswa (MahasiswaController::destroy)
      operationId: deleteMahasiswa
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data mahasiswa berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Data berhasil dihapus
                data: null
                errors: []
                timestamp: '2026-11-18T20:17:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - timestamp
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Data response berupa objek, array, atau null.
        errors:
          description: Daftar error umum atau detail validasi per field.
          oneOf:
            - type: array
              items:
                type: string
            - type: object
              additionalProperties:
                type: array
                items:
                  type: string
        timestamp:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: mahasiswa_uji
        email:
          type: string
          format: email
          example: mahasiswa_uji@example.com
        password:
          type: string
          format: password
          example: contoh-password

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: mahasiswa_uji
        password:
          type: string
          format: password
          example: contoh-password

    MahasiswaCreateRequest:
      type: object
      required:
        - nim
        - nama
        - email
        - id_prodi
        - angkatan
      properties:
        nim:
          type: string
          minLength: 9
          maxLength: 9
          example: E41230002
        nama:
          type: string
          maxLength: 100
          example: Siti Aminah
        jenis_kelamin:
          type: string
          enum: [L, P]
          default: L
          example: P
        alamat:
          type: string
          maxLength: 255
          example: Jl. Contoh
        email:
          type: string
          format: email
          maxLength: 100
          example: siti@example.com
        id_prodi:
          oneOf:
            - type: integer
            - type: string
              pattern: '^[0-9]+$'
          example: 1
        angkatan:
          oneOf:
            - type: integer
            - type: string
              pattern: '^[0-9]{4}$'
          example: '2024'
        status:
          type: string
          enum: [aktif, cuti, lulus]
          default: aktif
          example: aktif
        foto:
          type: string
          nullable: true
          maxLength: 255
          example: null

    MahasiswaUpdateRequest:
      type: object
      minProperties: 1
      properties:
        nim:
          type: string
          minLength: 9
          maxLength: 9
          example: E41230002
        nama:
          type: string
          maxLength: 100
          example: Siti Aminah Updated
        jenis_kelamin:
          type: string
          enum: [L, P]
          example: P
        alamat:
          type: string
          maxLength: 255
          example: Jl. Contoh Baru
        email:
          type: string
          format: email
          maxLength: 100
          example: siti.updated@example.com
        id_prodi:
          oneOf:
            - type: integer
            - type: string
              pattern: '^[0-9]+$'
          example: 1
        angkatan:
          oneOf:
            - type: integer
            - type: string
              pattern: '^[0-9]{4}$'
          example: '2024'
        status:
          type: string
          enum: [aktif, cuti, lulus]
          example: aktif
        foto:
          type: string
          nullable: true
          maxLength: 255
          example: null

  responses:
    BadRequest:
      description: Body JSON tidak valid atau field wajib pada endpoint autentikasi kosong.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: Body harus berupa JSON object yang valid
            data: null
            errors: []
            timestamp: '2026-11-18T20:20:00+07:00'
    Unauthorized:
      description: Token Bearer tidak ada, tidak valid, atau kedaluwarsa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: Token tidak ditemukan
            data: null
            errors: []
            timestamp: '2026-11-18T20:20:00+07:00'
    InvalidMahasiswa:
      description: Field mahasiswa tidak memenuhi validasi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: Data mahasiswa tidak valid
            data: null
            errors:
              nim:
                - NIM harus berjumlah 9 karakter.
            timestamp: '2026-11-18T20:20:00+07:00'
    StudentNotFound:
      description: Mahasiswa dengan NIM tersebut tidak ditemukan saat GET.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: Data mahasiswa tidak ditemukan
            data: null
            errors:
              nim:
                - Data mahasiswa dengan NIM tersebut tidak ditemukan.
            timestamp: '2026-11-18T20:20:00+07:00'
    NotFound:
      description: Mahasiswa dengan NIM tersebut tidak ditemukan saat PUT atau DELETE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: Data mahasiswa tidak ditemukan
            data: null
            errors: []
            timestamp: '2026-11-18T20:20:00+07:00'
