<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Akademik - Acara 27</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <style>
        dialog {
            width: min(560px, calc(100% - 2rem));
            max-height: 90vh;
            overflow-y: auto;
            border: 0;
            border-radius: var(--bs-border-radius-lg);
            box-shadow: var(--bs-box-shadow-lg);
        }
    </style>
    <script src="dashboard.js" defer></script>
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Dashboard Akademik</span>
            <div class="d-flex align-items-center gap-3">
                <span id="welcome" class="text-white small"></span>
                <button id="btn-logout" class="btn btn-outline-light btn-sm" type="button">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="notifikasi" class="alert d-none" role="alert" aria-live="assertive"></div>
        <p id="status" class="text-secondary" role="status" aria-live="polite">Memuat data...</p>

        <section class="row g-3 mb-4" aria-label="Ringkasan mahasiswa">
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h1 class="h6 text-secondary">Total Mahasiswa</h1>
                        <strong id="total-mahasiswa" class="display-6 text-primary">0</strong>
                    </div>
                </div>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h2 class="h5 mb-0">Data Mahasiswa</h2>
                <button id="btn-tambah" class="btn btn-success" type="button" hidden>Tambah Mahasiswa</button>
            </div>
            <div class="table-responsive">
                <table id="tabel-mahasiswa" class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th scope="col">NIM</th>
                            <th scope="col">Nama</th>
                            <th scope="col">ID Program Studi</th>
                            <th scope="col">Angkatan</th>
                            <th scope="col">Status</th>
                            <th scope="col">Foto</th>
                            <th id="kolom-aksi" scope="col" hidden>Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <dialog id="dialog-mahasiswa" class="p-0">
            <form id="form-mahasiswa">
                <div class="d-flex justify-content-between align-items-center border-bottom p-3">
                    <h2 id="judul-form" class="h5 mb-0">Tambah Mahasiswa</h2>
                    <button id="btn-tutup" class="btn-close" type="button" aria-label="Tutup"></button>
                </div>
                <div class="p-3">
                    <input id="mahasiswa-id" name="id" type="hidden">

                    <div class="mb-3">
                        <label class="form-label" for="nim">NIM</label>
                        <input class="form-control" id="nim" name="nim" maxlength="20" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="nama">Nama</label>
                        <input class="form-control" id="nama" name="nama" maxlength="100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="jenis_kelamin">Jenis Kelamin</label>
                        <select class="form-select" id="jenis_kelamin" name="jenis_kelamin" required>
                            <option value="L">Laki-laki</option>
                            <option value="P">Perempuan</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="alamat">Alamat</label>
                        <textarea class="form-control" id="alamat" name="alamat" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email (opsional)</label>
                        <input class="form-control" id="email" name="email" type="email" maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_prodi">ID Program Studi</label>
                        <input class="form-control" id="id_prodi" name="id_prodi" type="number" min="1" step="1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="angkatan">Angkatan</label>
                        <input class="form-control" id="angkatan" name="angkatan" type="number" min="1901" max="2155" step="1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="status-mahasiswa">Status</label>
                        <select class="form-select" id="status-mahasiswa" name="status" required>
                            <option value="aktif">Aktif</option>
                            <option value="cuti">Cuti</option>
                            <option value="lulus">Lulus</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="foto">Foto (JPG/PNG, maksimal 2MB)</label>
                        <input class="form-control" id="foto" name="foto" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                        <div id="foto-saat-ini" class="mt-2"></div>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 border-top p-3">
                    <button id="btn-batal" class="btn btn-outline-secondary" type="button">Batal</button>
                    <button class="btn btn-primary" type="submit">Simpan</button>
                </div>
            </form>
        </dialog>
    </main>
</body>
</html>
